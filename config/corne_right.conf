# The PS/2 UART driver (kb_zmk_ps2_mouse_trackpoint_driver/src/drivers/ps2/
# ps2_uart.c) receives with zephyr's interrupt-driven UART API
# (uart_irq_callback_user_data_set / uart_irq_rx_enable / uart_fifo_read), but
# its Kconfig only selects UART_ASYNC_API. Without this symbol those calls are
# no-op stubs, nothing is ever received from the trackpoint, and the driver
# silently gives up after its 10 init attempts.
#
# It goes unnoticed upstream because CONFIG_ZMK_USB_LOGGING selects
# UART_INTERRUPT_DRIVEN for the console, and infused-kim's reference config
# ships with USB logging enabled. Verified on this keyboard: the trackpoint is
# dead without it and works with it.
CONFIG_UART_INTERRUPT_DRIVEN=y
