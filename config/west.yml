manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: joelspadin
      url-base: https://github.com/joelspadin
    - name: badjeff
      url-base: https://github.com/badjeff
  projects:
    - name: zmk
      remote: zmkfirmware
      # Last known good on main as of 2026-04-21
      revision: 0331b7d16e80954b807917f9323e59ffc1e3b626
      import: app/west.yml
    # PS/2 mouse & trackpoint driver.
    #
    # badjeff's fork of infused-kim/kb_zmk_ps2_mouse_trackpoint_driver, which
    # is the maintained one: it builds against zephyr 4.1 (upstream still uses
    # the removed K_THREAD_STACK_MEMBER), supports multiple instances, fixes
    # the rst-gpios property lookup that silently skipped the power-on-reset,
    # and no longer needs the abandoned mouse-PR zmk fork.
    #
    # Only the PS/2 transport and the zephyr input driver are used; HID
    # reporting is handled by zmk's own pointing subsystem (CONFIG_ZMK_POINTING),
    # so the module's bundled input listener is never compiled.
    - name: kb_zmk_ps2_mouse_trackpoint_driver
      remote: badjeff
      revision: 7ab7846a95b233c3ada0e0605b972f36353e7bc4
  self:
    path: config
