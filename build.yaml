# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano//zmk
    shield: ergodox
    artifact-name: ergodox-nice_nano_v2
  - board: nice_nano//zmk
    shield: corne_left
    artifact-name: corne_left-nice_nano_v2
  - board: nice_nano//zmk
    shield: corne_right
    artifact-name: corne_right-nice_nano_v2
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset-nice_nano_v2
  # Diagnostic build of the right half with logging over USB serial, for
  # checking that the trackpoint initialises: flash it, then
  # `sudo cat /dev/ttyACM0` and look for the ps2_uart / mouse init lines.
  - board: nice_nano//zmk
    shield: corne_right
    snippet: zmk-usb-logging
    artifact-name: corne_right-nice_nano_v2-usb-logging
