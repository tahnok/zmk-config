name: Draw keymaps

on:
  push:
    paths:
      - 'config/**/*.keymap'
      - 'config/**/*.dtsi'
      - 'config/**/*.overlay'
      - 'keymap-layouts/**'
      - 'keymap_drawer.config.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'scripts/draw-keymaps.sh'
      - '.github/workflows/draw-keymaps.yml'
  pull_request:
    paths:
      - 'config/**/*.keymap'
      - 'config/**/*.dtsi'
      - 'config/**/*.overlay'
      - 'keymap-layouts/**'
      - 'keymap_drawer.config.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'scripts/draw-keymaps.sh'
      - '.github/workflows/draw-keymaps.yml'
  workflow_dispatch:

concurrency:
  group: keymap-drawer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.21'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Generate diagrams
        run: bash scripts/draw-keymaps.sh
      - name: Upload diagrams and parsed keymaps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keymap-diagrams
          path: |
            keymap-drawer/*.svg
            keymap-drawer/*.yaml
      - name: Commit updated diagrams
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: 'docs: regenerate keymap diagrams'
          file_pattern: 'keymap-drawer/*.svg keymap-drawer/*.yaml'
